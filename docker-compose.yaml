
services:
  moviebacklog:
    container_name: moviebacklog
    image: moviebacklog_image
    build:
      context: .
      dockerfile: MovieBacklog/Dockerfile
    restart: unless-stopped
    # Port will be proxied, so no need to expose it here
    # ports:
    #  - "8082:80"
    env_file: .env
    depends_on:
     - postgres
    networks:
      - backend
      - frontend-swarm
    labels:
      - "traefik.http.routers.moviebacklog.rule=Host(`moviebacklog.rlgland.site`)"
      - "traefik.http.routers.moviebacklog.entrypoints=websecure"
      - "traefik.http.routers.moviebacklog.tls.certresolver=cloudflare"
      - "traefik.http.services.moviebacklog.loadbalancer.server.port=80"

  postgres:
    container_name: moviebacklog_postgres
    image: postgres:15
    restart: unless-stopped
    # Internal port only, no need to expose it
    # ports: 
    #     - 5432:5432
    volumes:
        - ${CONFIG_PATH}/moviebacklog/db_data:/var/lib/postgresql/data
    env_file:
       - .env
    networks:
      - backend

networks:
  backend:
    external: true
  frontend-swarm:
    external: true
