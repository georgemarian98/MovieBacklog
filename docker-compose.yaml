version: '3.7'

services:
  app:
    container_name: 'moviebacklog'
    image: 'moviebacklog_image'
    build:
      context: .
      dockerfile: MovieBacklog/Dockerfile
    restart: unless-stopped
    # Port will be proxied by nginx, so no need to expose it here
    # ports:
    #  - "8082:80"
    environment:
      - RAPIDAPI_KEY
      - POSTGRES_HOST
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    depends_on:
     - "postgres"
    networks:
      - backend
      - frontend

  postgres:
    container_name: 'postgres'
    image: postgres:15
    restart: unless-stopped
    # Internal port only, no need to expose it
    # ports: 
    #     - 5432:5432
    volumes:
        - /srv/dev-disk-by-uuid-db265fe4-0194-49be-9153-c00fa45159e6/postgres/db_data:/var/lib/postgresql/data
    env_file:
       - .env
    networks:
      - backend

networks:
  backend:
    external: true
  frontend:
    external: true
